# Static server for the Trace frontend (apps/web/dist).
# The reverse proxy sends everything outside /nt /ct /lt here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx's mime.types has no entry for the PWA manifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The service worker must always be fresh, or an old app shell stays
    # installed.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # What is deployed (write-version.mjs): never cached, and missing is
    # missing, not the app page.
    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A shared recipe (/r/<token>): the app page, with the headers the
    # CookTrace backend sends for it, so the token doesn't travel on.
    # "rewrite ... break" stays in this block; try_files' fallback would
    # move to "location /" and lose them.
    location /r/ {
        rewrite ^ /index.html break;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "no-referrer";
        add_header X-Robots-Tag "noindex, nofollow";
    }

    # SPA fallback: client-side routes (e.g. /auth/callback/nt) get index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
